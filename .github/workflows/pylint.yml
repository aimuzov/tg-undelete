name: Pylint

on: [push, pull_request]

env:
  # Force javascript actions (checkout, setup-python) to run on Node.js 24
  # ahead of GitHub Actions' default switch in June 2026. Drop this once
  # v6 of the actions ships with Node 24 baked in.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint

      - name: Analysing the code with Pylint
        run: |
          pylint --rcfile=pyproject.toml $(git ls-files '*.py')
